apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-wallet
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mock-wallet
  template:
    metadata:
      labels:
        app: mock-wallet
    spec:
      containers:
        - name: mock-wallet
          image: mock-wallet                # ✅ use local image
          imagePullPolicy: Never           # ✅ don't pull from Docker Hub
          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10