name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t peeyushnaik/mock-wallet:latest ./backend

      - name: Push Docker image
        run: docker push peeyushnaik/mock-wallet:latest

      # 🔥 Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 🔥 Configure Kubeconfig (IMPORTANT)
      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      # 🔥 Deploy to Kubernetes
      - name: Deploy to K8s
        run: kubectl apply -f k8s/

      # 🔥 Force rollout (ensures new image is picked)
      - name: Restart Deployment
        run: kubectl rollout restart deployment mock-wallet